name: newton

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: newton
      POSTGRES_DB: newton
      POSTGRES_PASSWORD: ${NEWTON_POSTGRES_PASSWORD:?Run scripts/setup_local.py first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newton -d newton"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.5@sha256:c29b501d8fdab55d8b3fbe8c3db78e286ba0708536e7039d894d01a84ca6ba8b
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:15051:50051"
    environment:
      CLUSTER_HOSTNAME: newton-local
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "20"
      DEFAULT_VECTORIZER_MODULE: none
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${NEWTON_WEAVIATE_API_KEY:?Run scripts/setup_local.py first}
      AUTHENTICATION_APIKEY_USERS: newton-backend
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: newton-backend
      AUTOSCHEMA_ENABLED: "false"
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

volumes:
  postgres_data:
  weaviate_data:
