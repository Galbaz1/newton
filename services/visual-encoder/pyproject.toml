[project]
name = "newton-private-encoder"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Wonder Why AI — Fausto Albers"}]
description = "Private loopback-only pinned visual encoder"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "anyio==4.15.1",
  "starlette==1.6.0",
  "sentence-transformers[image]==6.1.0",
  "transformers==5.17.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "huggingface-hub==1.32.0",
  "safetensors==0.8.0",
  "numpy==2.5.3",
  "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx2==2.13.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["test_encoder_service.py"]
