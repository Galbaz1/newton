name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary:
    name: Source boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep private work outside the source package
        run: |
          if git ls-files | grep -E '^(deploy/|deployment/|infra/|ops/|research/|\.beads/|\.runtime/|\.vercel/)|(^|/)\.env($|\.)|(^|/)(railway|vercel)\.(json|toml)$' | grep -v '^\.env\.example$'; then
            echo 'Private operations, research, runtime, or credentials are tracked.' >&2
            exit 1
          fi
          if git grep -I -i -l -E 'newton[.]nu|railway[.]app|vercel[.]app' -- .; then
            echo 'Site-specific deployment references are tracked.' >&2
            exit 1
          fi

  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          python-version: '3.14.7'
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check server tests scripts
      - run: uv run --frozen pytest

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
